name: FHEM
version: "0.2.9-fhem6.5"
slug: fhem
description: FHEM home automation — MAX! via NanoCUL, bridged to HA over MQTT
url: https://github.com/tmtom/hassio-fhem/tree/main/fhem
arch:
  - amd64
  - aarch64
startup: services
init: false
timeout: 60
# Pre-built multi-arch image, built by GitHub Actions on every release.
image: ghcr.io/tmtom/hassio-fhem
ports:
  8083/tcp: 8083
  7072/tcp: null
ports_description:
  8083/tcp: FHEM web interface (FHEMWEB)
  7072/tcp: FHEM telnet console (optional)
webui: http://[HOST]:[PORT:8083]/fhem
uart: true
map:
  - type: app_config
    path: /opt/fhem
    read_only: false
services:
  - mqtt:want
# homeassistant_api: read Home Assistant's timezone via the Core API proxy so
# FHEM's clock (and the MAX! weekly programs) follow your HA setting. Read-only
# usage in run.sh; the hidden 'timezone' option overrides it.
homeassistant_api: true
options:
  mqtt_automatic: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  fhemmax2hass: true
  fhem_url: http://homeassistant.local:8083/fhem
  web_auth_user: ""
  web_auth_password: ""
schema:
  device: device(subsystem=tty)?
  mqtt_automatic: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  fhemmax2hass: bool
  fhem_url: str
  web_auth_user: str
  web_auth_password: password
  timezone: str?
backup: cold
backup_exclude:
  - "log/*.log"
