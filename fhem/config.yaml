name: FHEM
version: "0.1.0"
slug: fhem
description: FHEM home automation — MAX! via NanoCUL, bridged to HA over MQTT
url: https://github.com/tmtom/hassio-fhem/tree/main/fhem
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
timeout: 60
# Pre-built image is enabled in Phase 4; during development the app is built on device.
# image: ghcr.io/tmtom/hassio-fhem
ports:
  8083/tcp: 8083
  7072/tcp: null
ports_description:
  8083/tcp: FHEM web interface (FHEMWEB)
  7072/tcp: FHEM telnet console (optional)
webui: http://[HOST]:[PORT:8083]/fhem
watchdog: http://[HOST]:[PORT:8083]/fhem
uart: true
apparmor: true
map:
  - type: app_config
    path: /opt/fhem
    read_only: false
services:
  - mqtt:want
options:
  mqtt_automatic: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  fhemmax2hass: true
  fhem_url: http://homeassistant.local:8083/fhem
  timezone: Europe/Prague
schema:
  device: device(subsystem=tty)?
  mqtt_automatic: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  fhemmax2hass: bool
  fhem_url: str
  timezone: str
backup: hot
backup_exclude:
  - "log/*"
